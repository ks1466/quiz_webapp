<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>60초 공부퀴즈</title>
  <meta name="theme-color" content="#111111"/>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background:#f6f7f9; }

    .card { background:#fff; border-radius: 14px; padding: 16px; box-shadow: 0 6px 20px rgba(0,0,0,.06); margin-bottom: 12px; }

    .bar { height: 10px; background:#e9edf2; border-radius: 999px; overflow:hidden; }

    h1 { font-size: 18px; margin: 0 0 12px; }
    .label { font-weight:700; margin: 4px 0 6px; }
    .q { font-size: 20px; line-height: 1.45; white-space: pre-wrap; }
    .a { font-size: 18px; line-height: 1.45; white-space: pre-wrap; }
    .muted { color:#667; font-size: 13px; }
    button { width:100%; padding: 14px 14px; border-radius: 12px; border:0; font-size: 16px; font-weight: 800; }
    .primary { background:#111; color:#fff; }
    .ghost { background:#fff; color:#111; border:1px solid #d8dde6; margin-top: 10px; }
    .row { display:flex; gap:10px; }
    .row button { width: 50%; }
    @media (max-width: 480px) { .row { flex-direction: column; } .row button { width:100%; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>공부 퀴즈 (60초 / 1문제)</h1>
      <div class="timer" id="timer">60</div>
      <div class="bar"><div id="bar"></div></div>
      <div class="muted" id="cycleInfo" style="margin-top:10px;"></div>
    </div>

    <div class="card">
      <div class="label">문제</div>
      <div class="q" id="question">로딩중…</div>

      <div id="answerBox" style="display:none; margin-top:14px;">
        <div class="label">정답</div>
        <div class="a" id="answer"></div>
      </div>

      <div class="muted" id="hint" style="margin-top:14px;">
        60초가 끝나면 정답이 표시됩니다. (타이머 중에도 ‘다음 문제’ 가능)
      </div>
    </div>

    <div class="row">
      <button class="primary" id="nextBtn">다음 문제</button>
      <button class="ghost" id="showAnswerBtn">정답보기</button>
      <button class="ghost" id="restartBtn">타이머만 리셋</button>
    </div>

  </div>

    a: '1) 정지 위치를 지나 승강장내 정차한 경우, 차장과 협의하여 정지위치를 조정하고 관제사에게 즉시 보고\n2) 승강장을 완전히 벗어난 경우에는 관제사의 퇴행 승인을 받아 차장과 협의하여 퇴행' },

  { q: '6.29 ATS 구간(하선 금정역. 상선 산본역) 출발신호 정지 시 조치',
    a: '1) 차장에게 안내 방송 요청, 출발신호 정지 상태를 관제사에게 통보하여 운전 명령 번호를 수신\n2) 제동 핸들 4단 이상에서 ASOS 취급(수신호 통고 시 수신호 확인), 선로 전환기를 확인하면서 열차 후부가 맨 바깥쪽 선로 전환기 통과 시까지 25km/h 이하로 운전\n3) 맨 바깥쪽 선로 전환기부터 다음 신호기 위치까지 열차 없음이 확인될 때는 45km/h 이하, 그 밖에는 25km/h 이하로 운전' },

  { q: '6.30 장시간 단전 시 조치',
    a: '1) 관제사에게 단전 여부 및 급전 시기 확인하고 차장에게 안내 방송 요청\n2) 구름 방지 조치를 하고, TC차 배전반 내 EOCN ON 취급(EON, EORN ON 확인) 후\n3) Pan 하강 및 제동 핸들 취거, 축전지 전압 수시로 확인(74V 이상)\n4) 필요시 승객 편의를 위해 각 차량 출입문 1개씩 개방하고 급전 시까지 대기' },

  { q: '6.31 ASOS(특수 스위치) 취급 시기',
    a: '1) 수신호 또는 유도신호기에 따라 운전할 경우\n2) 입환 신호기 또는 구내 폐색신호기의 정지신호 현시 구간을 넘어서 운전할 경우\n3) 정지신호 R0 자동폐색신호기를 넘어서 운전하거나, 넘어서 정지한 경우\n4) 지상 장치가 고장일 경우\n5) 상치신호기 지상자가 설치된 입환 표지(입환신호기 포함)와 입환신호기의 개통 구간을 운전할 경우' },

  { q: '6.32 상선 범계, 인덕원, 대공원역 진출 시 진로 개통 표시기 불량 시 조치',
    a: '• 차내 신호가 진행을 현시해도 진로 개통 표시기를 지나 진입할 수 없고, 진행 수신호 생략 승인에 의해 운전' },

  { q: '6.33 직류 전환(AC→DC) 시 MCB 양 소등 발생 시 조치',
    a: '1) 즉시 EPanDS 취급, 절연 구간을 40km/h 이하로 무동력 운전\n2) 최근 역 정차, 모니터로 MCB 차단 불능 차량 확인, EPanDS 복귀하고 Pan 상승\n3) Pan 상승 불능 차의 MCBN1이 차단되어 있으면 복귀시키고,\n정상이면 해당 차 MCB 기계적 고착으로 판단, 완전 부동 취급 후 연장 급전하고 운전' },

  { q: '6.34 교류 전환(DC→AC) 시 MCB 양 소등 발생 시 조치',
    a: '1) 즉시 EPanDS 취급\n2) 최근 역 정차, 해당 차 완전 부동 취급 후 연장 급전하고 운전' },

  { q: '6.35 교류 모진 시 현상 및 조치',
    a: '▶ 현상\nDCArr 방전으로 전차선 단전되어 AC등 소등, 모니터에 ‘AC 과전류(1차)’ 현시되고, MCB OFF등, Fault등과 차측등(백색)이 점등\n\n▶ 조치\n1) 즉시 EPanDS 취급, 최근 정거장 도착 후 EPanDS 복귀\n2) 해당 차 완전 부동 취급 후 연장 급전\n3) MCBOS - RS - 3초 후-MCBCS 취급, FauIt등 및 차측등(백색)을 소등하고 운전' },

  { q: '6.36 교·직류 전환 시 MCB ON등 계속 점등 시 조치',
    a: '1) 2선이 단선되었거나 HCR2(b) 접점 불량 시, 후부 운전실 MCBHR 트립 코일(trip coil) 여자 불능으로 양쪽 운전실에서 7선 또는 8선이 가압되어 ADS를 전환해도 MCB 차단 불능\n2) 즉시 EPanDS 취급하고 직류 전환 시에는 절연 구간을 40km/h 이하로 운전하고, 교류 전환 시에는 그대로 운전하여 최근 정거장 도착, EpanDS 복귀하고 Pan 상승, MCB 투입 후 전도 운전\n3) 종착역 도착, 운전실 교환 후에는 후부 운전실 MCN 차단하고 전도 운전 후 입고 조치' },

  { q: '6.37 EPanDS 고착 또는 복귀 불능 시 조치',
    a: '• 전부 운전실 PanDN 차단하고 관제사 지시로 후부 운전실에서 추진 운전\n※ 차장이 승무하지 않은 1인 승무 열차일 경우, 구원받아 회송 조치' },

  { q: '6.38 EGCS 고착 또는 복귀 불능 시 조치',
    a: '• 전부 운전실 PanDN 차단하고 관제사가 지시하는 역까지 운전' },

  { q: '6.39 임시 신호기 종류',
    a: '• 서행 예고 신호기, 서행 신호기, 서행 해제 신호기' },

  { q: '6.40 임시 신호기 지나 동력 운전 시점',
    a: '1) ATC 구간은 전부 TC차가 서행 해제 신호기 지점에 도달하였을 때\n2) ATC 외 구간은 후부 TC차가 서행 해제 신호기를 지난 후 동력 운전' },

  { q: '6.41 임시 신호기(서행 예고 신호기) 설치 지점',
    a: '1) 지상 구간은 서행 신호기 전방 400m 이상 지점\n2) 지하 구간은 200m 이상 지점에 설치' },

  { q: '6.42 비상 전호 요령',
    a: '• 주간에는 양팔을 높이 들거나 녹색기 이외의 물건을 급격히 휘두르고,\n야간에는 녹색등 이외의 등을 급격히 휘두르거나 양팔을 높이 든다.' },

  { q: '6.43 기관사 안전장치(DSD)가 작동되지 않는 경우(DSD a접점)',
    a: '1) 정차(또는 운전 속도 5km/h 이하) 중 ZVR 여자 시\n2) 제동 취급으로 ELBR 여자 시\n3) DSSRR(절연 구간 표시 보조 계전기) 여자 시\n4) 동력 핸들(DSD)을 누르고 있을 때' },

  { q: '6.44 EBCOS 투입 중 기관사 안전장치(DSD) 작동 관련',
    a: '• 경고음은 계속 울리지만 비상제동은 체결되지 않음' },

  { q: '6.45 안산, 과천선 선로 최고 속도',
    a: '• 안산, 과천선 선로 최고 속도는 110km/h임.\n다만 과천선(금정~남태령)은 차내 신호기 (ADU)에 최고 80모드 현시되므로 80km/h 이하 운전' },

  { q: '6.46 지하 구간 운전 중 화재 발생 시 조치',
    a: '1) 관제사에게 화재 상황 급보 및 119와 관계처 직원 출동 요청 후, 차장에게 안내 방송과 승객분산 조치를 하도록 통보\n2) 최근 정거장까지 운전하여 여객 대피시킨 후, 출동한 119 및 직원과 함께 소화 조치' },

  { q: '6.47 출입문 고장에 따른 열차 회송 시',
    a: '• 마지막 열차 외에는 관제사 지시로 회송 조치함.\n지하 구간 회송 시 승강장 통과 속도는 45km/h 이하(한국철도공사 구간 60km/h)' },

  { q: '6.48 전체 출입문이 열리지 않는 경우',
    a: '1) 전부 TC차 CrSN 확인\n2) ATCN, ATCPSN, BVN1 차단 여부 확인(ZVR 무여자로 출입문이 열리지 않음)\n3) 전부 TC차에서 DOS 취급해 볼 것\n4) 관제사 보고 후, 후부 운전실 제어대 LSBS ON 취급하고 DOS 취급' },

  { q: '6.49 출입문 양 소등 현상',
    a: '• 출입문(DOOR)등과 출입문 차측등이 모두 소등되어 있는 상태' },

  { q: '6.50 전ㆍ후부 운전실 DILPN 차단 후 복귀 불능 시 현상과 조치',
    a: '▶ 현상 : 출입문(DOOR)등과 계기등이 소등\n▶ 조치\n1) 전부 운전실 DILPN 복귀 불능 시는 동력 운전이 가능하므로 관제사 지시에 따라 주의 운전\n2) 후부 운전실 DILPN 복귀 불능 시 및 DS 접점 불량 시는 동력 운전 불능이므로 관제사 승인을 받고 DIRS(비연동) 투입하고 관제사가 지시하는 역까지 주의 운전\n※ 1), 2)의 경우 모니터로 출입문 닫힘 상태 확인하면서 운전.' },

  { q: '6.51 1개 출입문이 닫히지 않을 때 조치',
    a: '1) 해당 출입문 전자밸브(DMV) 및 공기관 Cock 이물질 확인\n2) 관제사에게 보고 후 역무원 등 안내원 승차와 DIRS 취급 승인을 받고, 승객 분산 조치\n3) 출입문 수동 잠금 및 고장 안내문 부착 후 차량 교체 역까지 운전.\n4) 출입문 수동 잠금 불능 시 회송 조치' },

  { q: '6.52 1개 출입문이 열리지 않을 때 조치',
    a: '1) 해당 출입문 전자밸브(DMV) 및 공기관 Cock 확인\n2) 관제사에게 보고 및 승객 분산 조치\n3) 출입문 수동 잠금 및 고장 안내문 부착 후 차량 교체 역까지 운전\n※ 편성 중 2개 이상 출입문 고장 시 회송' },

  { q: '6.53 전체 출입문이 닫히지 않을 때 조치',
    a: '1) DOS(출입문 개폐 스위치)를 수회 취급\n2) CrSN OFF 후 ON 취급' },

  { q: '6.54 BVN1, BVN2 차단 또는 HCRN 차단 시 조치',
    a: '• EBCOS 취급하여도 비상제동 완해 불능이므로 관제사 지시로 추진 운전' },

  { q: '6.55 ATC 차상 장치 고장 시 현상 및 조치',
    a: '▶ 현상\nADU에‘STOP’신호 현시, 경고음이 울리고 비상제동 체결되며, 제동 핸들 1~7단 위 치에서 경고음 정지\n\n▶ 조치\n1) 관제사에게 보고, 지시를 받아 ATCCOS 차단하고 지령 운전(45km/h 이하)' },

  { q: '6.56 ATC 차단(ATCCOS 차단 취급)하는 경우와 운전 방법',
    a: '1) ATCCOS 차단 취급을 하는 경우\n① ATC 차상 장치 고장 시\n② ATCN, ATCPSN 차단 후 복귀 불능 시\n③ 구원열차 운전 시\n④ 대용 폐색 방식 시행 시\n※ ATCCOS 차단 취급은 반드시 관제사 승인을 받은 후 취급\n\n2) ATCCOS 차단 취급 운전 방법\n① ADU에 15모드 현시되고, 8초 알람 경보 울림\n② 관제사가 지정한 정거장까지 지령 운전(45km/h 이하 속도로 운전)' },

  { q: '6.57 ATC 구간 지시 속도 초과 시 운전 취급',
    a: '1) 경고음(“삐~”)이 울리고 ADU에 지령 속도가 깜박(Flash)이며, 자동으로 ATC에 의한 상용 7스텝 제동이 체결.\n2) 제동 핸들을 1~7스텝 위치로 하여 확인 제동 취급하면 경고음이 멈추지만, 지령 속도 이하가 될 때까지 ADU 깜박임은 계속됨. 이때 동력 운전 중이면 동력 핸들을 OFF 위치\n3) 실제 속도가 지시 속도 이하로 되면 제동 핸들을 완해 위치' },

  { q: '6.58 ADU 차내 신호기에 정지(Stop)신호 현시될 수 있는 경우와 조치',
    a: '1) 앞서가는 열차에 접근한 경우, 또는 ATC 지상 장치 고장 등으로 레일에 신호 주파수가 없으면(무신호) ADU에 “Stop” 현시되고, ATC 속도 초과 제동 작용으로 자동 정차된 후 ADU에 “15모드”가 현시\n2) 신호 현시를 기다리거나 관제사 승인(한국철도공사 승인 생략) 후, 확인 운전(15km/h 이하)' },

  { q: '6.59 VZ 고장 시(작동 불능 시) 현상',
    a: '1) ATC 정지신호(“0모드”)에 의해 정차하면, ADU에 “15모드” 현시되지 않음.\n2) 원인 :\n① BVN1, ATCN, ATCPSN 차단 시\n② 차축에 설치된 속도발전기(Speed Sensor) 고장 시 등' },

  { q: '6.60 ATC 구간 대용 폐색 방식 시행 종류',
    a: '1) 복선 운전을 할 때 : 지령식, 통신식\n2) 단선 운전을 할 때 : 지령식, 지도통신식' },

  { q: '6.61 ATS 구간에서 폐색신호기 정지신호일 경우의 운전',
    a: '1) 신호기 바깥쪽에 일단 정차 후 정지신호 구간을 15km/h 이하로 운전\n2) 관제사 승인이 있으면 특수 스위치(ASOS)를 취급하고 45km/h(최초 열차 25km/h) 이하' },

  { q: '6.62 ATS 구간에서 15km/h 스위치를 취급하는 경우',
    a: '1) 정지신호(R1) 자동폐색신호기를 넘어서 운전하거나, 넘어서 정지한 경우\n2) 폐색신호기가 소등된 구간을 운전할 경우' },

  { q: '6.63 ATSCOS 차단 취급을 하는 경우',
    a: '1) 대용 폐색 방식 시행 시\n2) 구원 운전 시\n3) ATS 차상 장치 고장 시\n4) ATS에 의한 비상제동 완해 불능 시' },

  { q: '6.64 교-교 절연 구간 정차 시 현상 및 조치',
    a: '1) 절연 구간에 근접하여 정차\n① 현상은 MCB ON 점등, AC등 점등, SIV등 점등\n② 조치는 관제사 퇴행 운전 승인 후 차장 전호에 의해 25km/h 이하로 인출 지점까지 후진 후, 다시 동력 운전 취급하여 절연 구간 통과\n\n2) 전부 Pan이 절연 구간에 정차\n① 현상은 MCB 양 소등, AC등 점등, SIV등 점등\n② 조치는 관제사 퇴행 운전 승인 후 차장 전호에 의해 25km/h 이하로 인출 지점까지 퇴행 후, MCBOS - MCBCS 취급하여 MCB 투입 후 다시 동력 운전 취급으로 절연 구간 통과\n\n3) 중간 Pan이 절연 구간에 정차\n① 현상은 MCB 양 소등, AC등 점등, SIV등 점등\n② 조치는 후부 M\'차 배전반 내 ADAN, ADDN, PanVN을 차단하여 후부 Pan을 내리고, 절연 구간 통과 후 최근 정거장 도착, 관계차단기 복귀하고 MCBOS-MCBCS 취급하여 MCB 투입 후 운전\n\n4) 후부 Pan이 절연 구간에 정차\n① 현상은 MCB 양 소등, AC등 점등, SIV등 점등\n② 조치는 그대로 동력 운전 취급하여 인출, 절연 구간 통과 후 MCBOS-MCBCS 취급하여 MCB 투입 후 운전' },

  { q: '6.65 교-직 절연 구간 정차 시 조치',
    a: '1) 전부 Pan이 절연 구간에 정차(또는 근접하여 정차)\n① 현상은 MCB OFF등 점등, AC등 또는 DC등 점등, SIV등 소등\n② 조치는 관제사의 퇴행 운전 승인 후 ADS를 절환 전의 위치로 다시 절환하여 MCB 투입 시키고, 차장 전호에 의해 15km/h 이하로 인출 가능 지점까지 퇴행 후, 다시 동력 운전 취급 하여 절연 구간 통과\n\n2) 중간 Pan 및 후부 pan이 절연 구간에 정차\n① 현상은 MCB 양 소등, AC등 및 DC등 점등, SIV등 점등\n② 조치는 그대로 동력 운전 취급하여 절연 구간 통과\n\n3) 후부 Pan이 절연 구간에 정차\n① 현상은 MCB 양 소등, AC등 또는 DC등 점등, SIV등 점등\n② 조치는 그대로 동력 운전 취급하여 절연 구간 통과' },

  { q: '6.66 과천선 VVVF 전동차 PanPS 압력',
    a: '• 4.2~4.4kg/㎠로, Pan 상승 작용' },

  { q: '6.67 BCN과 VN 차단 시 현상',
    a: '1) BCN : 편성 모두 차단 시 축전지 충전 불능\n2) VN : 103선 가압되었으나 축전지 전압계 현시 불능' },

  { q: '6.68 ATC 차상 장치 구성 요소',
    a: '1) Pick Up Coil, 속도발전기, ATC Rack, ADU' },

  { q: '6.69 열차 화재로 정거장 외에서 승객 대피 시 조치',
    a: '1) 관제사에게 상황 보고\n2) 교량 또는 터널 내 일 때 그 바깥까지 운전, 지하구간은 최근 역 또는 지하 구간 밖으로 운전.\n3) 열차 정차 후 신속한 소화 조치 및 여객을 안전한 장소로 대피 유도 또는 화재 차량을 격리 조치' },

  { q: '6.70 ATS 알람 벨(Alarm Bell)이 계속 작동 시',
    a: '1) ATSCOS 취급 후 비상제동은 완해되나, Alarm Bell이 계속 작동할 경우 - ATS함 내 ATSN2를 차단\n2) ATS Alarm Bell이 계속 울리고 비상제동이 작동할 경우 조치 - ATS함 내 ATSN1를 확인하여 복귀 취급' },

  { q: '6.71 전차선 장애로 Pan 파손 시 현상 및 조치',
    a: '▶ 현상 : 해당 차량 MCB 차단으로 MCB 양 소등, SIV 점등, Power등 점등 불능\n▶ 조치 :\n1) 관제사에게 관계 직원 출동 요청하여 파손된 Pan을 결박 조치\n2) 해당 차량 완전 부동 취급(ADAN, ADDN 차단, PanVN 차단 및 Pan 공기관 Cock 차단) 후 연장 급전(IVCN 차단, ESS 1 또는 2위치)' },

  { q: '6.72 전동 열차 편성 중 5개 차량 제동 불능 시 조치',
    a: '• 제동축 비율에 따라 70km/h 이하의 속도로 운전' },

  { q: '6.73 축전지 전압이 낮을 경우 ACM 구동 방법',
    a: '1) M\'차 1칸만 선택하여 ACM을 구동하기 위하여 나머지 차량의 ACMN 또는 ACMKN을 차단 후 ACMCS를 취급\n2) ACM 구동된 1개 차량의 Pan 상승, MCB 투입으로 SIV 및 CM 구동하여 충기(充氣)가 된 MR 압력으로 나머지 차량을 기동' },

  { q: '6.74 대용 폐색 방식이란',
    a: '1) 폐색장치의 고장 또는 기타 사유로 상용 폐색 방식을 사용할 수 없을 경우에 대용으로 사용하는 폐색 방식\n2) 도시철도운전규칙에서는 복선 운전 시 지령식 또는 통신식, 단선 운전 시 지도통신식을 사용\n3) 철도차량운전규칙에서는 통신식, 지도통신식, 지도식, 지령식' },

  { q: '6.75 기관사가 운전실 이석 시 조치',
    a: '1) 역장 또는 관제사에게 사유 보고\n2) 주차제동 체결, 구름 방지 조치 후 MC 키를 휴대하고 운전실 문 쇄정' },

  { q: '6.76 사고 시 열차 방호의 종류와 방법',
    a: '1) 열차 방호의 종류(한국철도공사 구간)\n① 열차무선 방호장치 방호 ② 무선전화기 방호\n③ 열차 표지 방호 ④ 정지 수신호 방호\n⑤ 방호스위치 방호 ⑥ 역구내 신호기 일괄제어 방어\n\n2) 열차방호의 방법\n① 열차의 방호는 지장선로의 앞·뒤 양쪽에 시행함을 원칙으로 한다.\n② 다만, 열차가 진행하여 오지 않음이 확실한 방향과 무선전화기 방호에 따라 관계 열차에 지장 사실을 확실히 통보한 경우에는 정지수신호 방호 또는 열차표지 방호를 생략할 수 있다.' },

  { q: '6.77 임시신호기 설치 위치',
    a: '1) 서행 예고 신호기 : 서행 신호기 이전 200m(지상 구간 400m) 이상에 설치\n2) 서행 신호기 : 지장 개소로부터 50m 이전에 설치\n3) 서행 해제 신호기 : 지장 개소로부터 50m+ 전동차 편성 길이” 이상의 거리에 설치\n(지상 구간은 지장 개소로부터 50m 지난 지점에 설치)' },

  { q: '6.78 전부운전실 ATCN트립 발생시 현상',
    a: '1) 비상제동 작동\n2) ADU 무현시(소등)\n3) 동력 운전 불능\n4) 정차 후 출입문 열림 불능(ZVR 무여자)\n5) 정차 중 DSD 누르지 않고 제동 완해하면 운전자 경계장치 작동(ZVR 무여자)' },

  { q: '6.79 DSD 작동하지 않는 경우',
    a: '1) 정차 또는 5km/h 이하로 운행하여 ZVR 여자 되는 경우\n2) 제동 취급으로 ELBR 여자 되는 경우\n3) DSSRR(절연 구간 표시 보조 계전기) 여자 되는 경우\n4) 동력 제어기(DSD)를 누르고 있는 경우' },

  { q: '6.80 BVN1, 2차단 시 현상',
    a: '1) 비상제동 체결\n2) 출입문 취급 불능(ZVR 무여자)\n3) ATS, ATC 작동 불능\n4) 동력 운전 불능' },

  { q: '6.81 DOS의 DCS(출입문 닫힘 스위치)접점 불량시 조치',
    a: '1) DCS 접점 불량 방향의 출입문을 연 후 DCS 취급하여 출입문이 닫히지 않으면 CrSN OFF 후 ON 취급\n2) 운행 중 DCS접점 불량 방향으로 승강장이 있는 경우 DOS 취급으로 출입문 개방 후, CrSN OFF 후 ON 취급으로 전체 출입문 닫을 것\n3) 관제사 보고 후 지시하는 역까지 운행하고 회송 조치' },

  { q: '6.82 각종 표지',
    a: '' } // 텍스트 추출이 안 잡혀서(이미지/도형 가능성). 필요하면 네가 직접 채워 넣기.
];
  // ⚠️ 위 bank는 “6.1~6.82” 텍스트 기반으로 정리한 기본 세트야.
  // 네가 말한 82문항 전체(6.1~6.82) 중 “중간 세부 항목이 더 많거나” PDF에 추가 문항이 더 있었다면
  // 그 부분은 원본 형식 그대로 여기 bank에 추가해주면 됨.

  let deck = [];
  let deckPos = 0;

  let currentIndex = 0;
  let remaining = TOTAL;
  let timerId = null;
  let showAnswer = false;

  const $ = (id) => document.getElementById(id);

  function resetDeck(shuffle=true) {
    deck = [...Array(bank.length).keys()];
    if (shuffle) deck.sort(() => Math.random() - 0.5);
    deckPos = 0;
  }

  function stopTimer() {
    if (timerId) {
      clearInterval(timerId);
      timerId = null;
    }
  }

  function startTimer() {
    stopTimer();
    showAnswer = false;
    remaining = TOTAL;
    timerId = setInterval(() => {
      remaining -= 1;
      if (remaining <= 0) {
        remaining = 0;
        showAnswer = true;
        stopTimer();
      }
      render();
    }, 1000);
    render();
  }

  function drawNext() {
    if (!bank.length) return;

    // ✅ 타이머 남아도 다음 가능: 다음 눌렀을 때 타이머 즉시 리셋
    // (그래서 여기서 stopTimer() 먼저)
    stopTimer();

    if (deckPos >= deck.length) resetDeck(true); // 한 바퀴 끝나면 다시 섞기
    currentIndex = deck[deckPos++];
    showAnswer = false;
    remaining = TOTAL;
    render();
    startTimer();
  }

  function restartTimerOnly() {
    startTimer();
  }

  function toggleAnswer() {
    showAnswer = !showAnswer; // 보기/숨기기 토글
    render();
  }

  function render() {
    $("timer").textContent = remaining;
    $("bar").style.width = (remaining / TOTAL * 100) + "%";

    const item = bank[currentIndex] || { q: "문제가 없습니다.", a: "" };
    $("question").textContent = item.q;

    $("showAnswerBtn").textContent = showAnswer ? "정답숨기기" : "정답보기";
    $("answerBox").style.display = showAnswer ? "block" : "none";
    $("hint").style.display = showAnswer ? "none" : "block";
    $("answer").textContent = item.a;

    const total = bank.length;
    const solved = Math.min(deckPos, total);
    const left = total - solved;
    $("cycleInfo").textContent = total
      ? `이번 바퀴 남은 문제: ${left} / ${total}`
      : "";
  }

  $("nextBtn").addEventListener("click", drawNext);
  $("restartBtn").addEventListener("click", restartTimerOnly);
  $("showAnswerBtn").addEventListener("click", toggleAnswer);

  // 초기 시작
  resetDeck(true);
  drawNext();
})();
</script>
